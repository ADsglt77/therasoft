services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_therasoft:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    image: therasoft-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DB_USER: ${DB_USER}
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      NODE_ENV: ${NODE_ENV:-production}
      RESET_DB_ON_SEED: ${RESET_DB_ON_SEED:-true}
      # Liens des emails (vérification) + SMTP (vérification d'email)
      APP_URL: ${APP_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-TsXcare <no-reply@tsxcare.local>}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    build: ./nginx
    # Pas de ports ici : Dokploy (et autres reverse proxy) route vers nginx:80 en interne.
    # En local, docker-compose.override.yml publie HTTP_PORT sur l'hôte.
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  studio:
    profiles: [studio]
    image: therasoft-backend
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    ports:
      - "5555:5555"
    entrypoint: ["sh", "-c", "npx prisma studio --url \"$$DATABASE_URL\" --port 5555 --browser none"]

volumes:
  postgres_therasoft:
  uploads_data:
