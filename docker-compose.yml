services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_therasoft_v4:/var/lib/postgresql/data
    networks:
      - dokploy-network
      - default

  backend:
    build: ./backend
    # Pas de volume : on utilise l'image buildée (dist/ présent). En dev local, remettre ./backend:/app si besoin.
    ports:
      - "5555:5555"
    depends_on:
      - db
    environment:
      # En Docker, l’URL doit pointer vers le service db. Construite à partir des mêmes variables que le .env racine.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      NODE_ENV: ${NODE_ENV:-development}
      DOCKER_CONTAINER: "true"
    stdin_open: true
    tty: true
    networks:
      - dokploy-network
      - default

  frontend:
    build: ./frontend
    # Image prod : build Angular + nginx qui sert le dist sur le port 80 (pas de volume)
    depends_on:
      - backend
    networks:
      - dokploy-network
      - default

  nginx:
    build: ./nginx
    # Port 80 exposé uniquement en dev via docker-compose.override.yml
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dokploy-network
      - default

volumes:
  postgres_data_therasoft_v4:

networks:
  dokploy-network:
    external: true
  default:
    driver: bridge
