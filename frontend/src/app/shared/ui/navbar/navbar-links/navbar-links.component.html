@if (route) {
  <a class="link" [routerLink]="route" routerLinkActive="active" (click)="onClick($event)">
    <app-icon [name]="icon" [size]="20" class="icon"></app-icon>
    <p class="label">{{ text }}</p>
  </a>
} @else {
  <a class="link" (click)="onClick($event)">
    <app-icon [name]="icon" [size]="20" class="icon"></app-icon>
    <p class="label">{{ text }}</p>
  </a>
}
