<div class="card">
  <span class="card__icon card__icon--{{ variant }}">
    <app-icon [name]="icon" [size]="iconSize"></app-icon>
  </span>
  @if (title) {
    <h1 class="card__title">{{ title }}</h1>
  }
  @if (message) {
    <p class="card__message">{{ message }}</p>
  }
  <ng-content></ng-content>
</div>
