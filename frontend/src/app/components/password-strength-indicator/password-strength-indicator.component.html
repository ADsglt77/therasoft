@if (password) {
  <div class="password-strength-indicator">
    <div
      class="segments-container"
      role="progressbar"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="rules.length"
      [attr.aria-valuenow]="validCount"
      [attr.aria-label]="'Force du mot de passe : ' + validCount + ' sur ' + rules.length + ' critères remplis'">
      @for (rule of rules; track $index) {
        <div class="segment" [class.segment--valid]="rule.isValid"></div>
      }
    </div>
  </div>
}
