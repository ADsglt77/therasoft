<div class="vocal-controls" role="group" [attr.aria-label]="'Contrôles d\'enregistrement vocal'">
  <!-- Bouton principal : Enregistrer / Écouter -->
  <button
    type="button"
    class="vocal-button"
    [class.vocal-button--recording]="state === 'recording'"
    [class.vocal-button--playing]="state === 'playing'"
    [class.vocal-button--ready]="state === 'ready' && hasRecording"
    [class.vocal-button--disabled]="disabled"
    [disabled]="disabled"
    (click)="handleMainButtonClick(); $event.stopPropagation()"
    (keydown.enter)="handleMainButtonClick(); $event.stopPropagation()"
    (keydown.space)="handleMainButtonClick(); $event.preventDefault(); $event.stopPropagation()"
    [attr.aria-label]="getButtonLabel()"
    [attr.aria-pressed]="state === 'recording' || state === 'playing' ? 'true' : 'false'"
    [attr.aria-busy]="state === 'recording' ? 'true' : 'false'"
    [attr.aria-disabled]="disabled ? 'true' : 'false'"
    role="button"
    tabindex="0"
    *ngIf="state === 'idle' || state === 'ready' || state === 'recording' || state === 'playing'"
  >
    <app-icon
      [name]="getIconName()"
      [size]="20"
      [color]="state === 'recording' ? 'var(--color-danger)' : 'var(--text)'"
      class="vocal-icon"
    ></app-icon>
    <span class="vocal-label">{{ getButtonLabel() }}</span>
    @if (state === 'recording') {
      <div class="vocal-recording-info">
        <!-- Indicateur de niveau audio (comme Instagram) -->
        <div class="vocal-volume-indicator">
          <div class="vocal-volume-bar" [style.width.%]="currentVolume"></div>
        </div>
        <span class="vocal-duration">{{ formatDuration(currentDuration) }}</span>
      </div>
    }
    @if (state === 'playing') {
      <div class="vocal-playback-info">
        <!-- Indicateur de progression audio -->
        <div class="vocal-progress-indicator">
          <div class="vocal-progress-bar" [style.width.%]="recordingDuration > 0 ? (currentPlaybackTime / recordingDuration) * 100 : 0"></div>
        </div>
        <span class="vocal-duration">{{ formatDuration(currentPlaybackTime) }} / {{ formatDuration(recordingDuration) }}</span>
      </div>
    }
    @if (state === 'ready' && hasRecording && recordingDuration > 0) {
      <span class="vocal-duration">{{ formatDuration(recordingDuration) }}</span>
    }
  </button>

  <!-- Bouton Arrêter (pendant l'enregistrement) -->
  <button
    type="button"
    class="vocal-button vocal-button--stop"
    (click)="onStopRecording(); $event.stopPropagation()"
    (keydown.enter)="onStopRecording(); $event.stopPropagation()"
    (keydown.space)="onStopRecording(); $event.preventDefault(); $event.stopPropagation()"
    [attr.aria-label]="'Arrêter l\'enregistrement'"
    role="button"
    tabindex="0"
    *ngIf="state === 'recording'"
  >
    <app-icon name="square" [size]="16" color="var(--text)"></app-icon>
    <span class="vocal-label">Arrêter</span>
  </button>

  <!-- Bouton Annuler (pendant l'enregistrement) -->
  <button
    type="button"
    class="vocal-button vocal-button--cancel"
    (click)="onCancelRecording(); $event.stopPropagation()"
    (keydown.enter)="onCancelRecording(); $event.stopPropagation()"
    (keydown.space)="onCancelRecording(); $event.preventDefault(); $event.stopPropagation()"
    [attr.aria-label]="'Annuler l\'enregistrement'"
    role="button"
    tabindex="0"
    *ngIf="state === 'recording'"
  >
    <app-icon name="x" [size]="16" color="var(--text-muted)"></app-icon>
  </button>

  <!-- Indicateur de traitement -->
  @if (state === 'processing') {
    <div class="vocal-processing" role="status" aria-live="polite" aria-busy="true">
      <div class="vocal-spinner" aria-hidden="true"></div>
      <span>Traitement en cours...</span>
    </div>
  }

  <!-- Bouton Supprimer (si enregistrement existant) -->
  @if (hasRecording && (state === 'ready' || state === 'idle')) {
    <button
      type="button"
      class="vocal-button vocal-button--delete"
      (click)="onDeleteRecording(); $event.stopPropagation()"
      (keydown.enter)="onDeleteRecording(); $event.stopPropagation()"
      (keydown.space)="onDeleteRecording(); $event.preventDefault(); $event.stopPropagation()"
      [disabled]="disabled"
      [attr.aria-label]="'Supprimer l\'enregistrement'"
      [attr.aria-disabled]="disabled ? 'true' : 'false'"
      role="button"
      tabindex="0"
    >
      <app-icon name="trash" [size]="16" color="var(--color-danger)"></app-icon>
    </button>
  }
</div>
