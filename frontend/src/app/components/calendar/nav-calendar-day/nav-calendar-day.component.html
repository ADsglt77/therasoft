<app-icon name="arrow-left" [size]="20" (click)="onGoBack()" class="back-icon"></app-icon>
<div class="header">
    <div class="title">
        <app-icon name="calendar" [size]="30"></app-icon>
        <h4>Calendrier</h4>
    </div>
    <div class="day">
        <app-icon name="arrow-left" [size]="15" [strokeWidth]="3" (click)="onPreviousDay()"></app-icon>
        <h4>{{ dayOfWeek }}</h4>
        <app-icon name="arrow-right" [size]="15" [strokeWidth]="3" (click)="onNextDay()"></app-icon>
    </div>
    <div class="month-info">
        <h4>{{ monthName }}</h4>
    </div>
</div>
