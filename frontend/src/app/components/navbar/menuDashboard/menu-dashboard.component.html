<!-- Sidebar desktop -->
<div class="nav-sidebar">
  <div class="header">
    <a class="title" routerLink="/calendar">
      <app-icon name="calendar-heart" [size]="36" class="brand-icon"></app-icon>
      <h2 class="brand-title">TsXcare</h2>
    </a>
    <div class="links">
      <app-navbar-links icon="globe" text="Site" route="/site" [iconOnly]="collapsed"></app-navbar-links>
      <app-navbar-links icon="calendar" text="Calendrier" route="/calendar" [iconOnly]="collapsed"></app-navbar-links>
      <app-navbar-links icon="settings" text="Paramètres" route="/settings" [iconOnly]="collapsed"></app-navbar-links>
    </div>
  </div>
  <div class="footer">
    <div class="profil">
      <div class="profil-avatar-wrap">
        <ui-avatar [initial]="userInitials" [avatarUrl]="currentUser?.avatarUrl"></ui-avatar>
      </div>
      <div class="profil-info">
        <h6>{{ currentUser?.nom?.toUpperCase() || 'Chargement...' }}</h6>
        <p>{{ currentUser?.prenom || '' }}</p>
      </div>
      <div
        class="icon-logout-wrapper"
        (click)="onLogout()"
        (keydown.enter)="onLogout()"
        (keydown.space)="$event.preventDefault(); onLogout()"
        role="button"
        tabindex="0"
        aria-label="Se déconnecter">
        <app-icon name="logout" [size]="20" [color]="'var(--logout-icon-color)'" class="icon"></app-icon>
      </div>
    </div>
  </div>
</div>

<!-- Mobile : mêmes liens que la sidebar, en barre fixe en bas -->
<nav class="nav-bottom" aria-label="Navigation principale">
  <app-navbar-links icon="globe" text="Site" route="/site" [exact]="true"></app-navbar-links>
  <app-navbar-links icon="calendar" text="Calendrier" route="/calendar"></app-navbar-links>
  <app-navbar-links icon="settings" text="Paramètres" route="/settings" [exact]="true"></app-navbar-links>
</nav>
