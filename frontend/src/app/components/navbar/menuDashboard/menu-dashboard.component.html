<div class="header">
  <a class="title" routerLink="/" [attr.aria-label]="collapsed ? 'TsXcare — accueil' : null">
    <app-icon name="calendar-heart" [size]="collapsed ? 28 : 36"></app-icon>
    @if (!collapsed) {
      <h2>TsXcare</h2>
    }
  </a>
  <div class="links">
    <app-navbar-links icon="globe" text="Site" route="/dashboard/site" [iconOnly]="collapsed"></app-navbar-links>
    <app-navbar-links icon="dashboard" text="Dashboard" route="/dashboard/planning" [iconOnly]="collapsed"></app-navbar-links>
    <app-navbar-links icon="settings" text="Settings" route="/dashboard/settings" [iconOnly]="collapsed"></app-navbar-links>
  </div>
</div>
@if (!collapsed) {
  <div class="footer">
    <div class="profil">
      <ui-avatar [initial]="userInitials" [avatarUrl]="currentUser?.avatarUrl"></ui-avatar>
      <div class="profil-info">
        <h6>{{ currentUser?.nom?.toUpperCase() || 'Chargement...' }}</h6>
        <p>{{ currentUser?.prenom || '' }}</p>
      </div>
      <button
        type="button"
        class="icon-logout-wrapper"
        (click)="onLogout()"
        aria-label="Se déconnecter">
        <app-icon name="logout" [size]="20" [color]="'var(--logout-icon-color)'" class="icon"></app-icon>
      </button>
    </div>
  </div>
} @else {
  <div class="footer footer-collapsed">
    <button
      type="button"
      class="icon-logout-wrapper"
      (click)="onLogout()"
      aria-label="Se déconnecter">
      <app-icon name="logout" [size]="20" [color]="'var(--logout-icon-color)'" class="icon"></app-icon>
    </button>
  </div>
}
