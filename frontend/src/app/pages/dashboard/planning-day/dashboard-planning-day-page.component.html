<div class="dashboard-planning-day-page">
  <app-nav-calendar-day
    [dayOfWeek]="dayOfWeek"
    [monthName]="monthName"
    (previousDay)="previousDay()"
    (nextDay)="nextDay()"
    (goBack)="goBack()">
  </app-nav-calendar-day>

  <div class="content">
    @if (daysDifference !== null) {
    <div class="info-badge">
      <app-icon name="calendar" [size]="28"></app-icon>
      <ui-badge [variant]="badgeVariant" [text]="dateBadgeText"></ui-badge>
    </div>
    }

    @if (!isWeekend) {
    <div class="planning-section">
      <h3>Vacations programmées</h3>
      <p class="placeholder">Les vacations pour ce jour seront affichées ici</p>
      <!-- TODO: Afficher les vacations réelles depuis l'API -->
    </div>
    }
  </div>
</div>
