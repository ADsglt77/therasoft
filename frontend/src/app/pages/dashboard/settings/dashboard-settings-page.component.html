@if (isLoading) {
<div class="loading">Chargement...</div>
} @else {
<h2>Informations personnelles</h2>
<form [formGroup]="profileForm" (ngSubmit)="onUpdateProfile()">
  <div class="profile-fields-container">
    <div class="container-inputs">
      <ui-input type="email" label="Email (Login)" [value]="currentUser?.email || ''" [disabled]="true" id="login"
        message="L'email ne peut pas être modifié" messageType="info">
      </ui-input>
      <ui-input type="text" label="Nom" [value]="profileForm.get('nom')?.value || ''"
        (input)="updateFormControl(profileForm, 'nom', $any($event.target).value)" placeholder="Nom" id="nom"
        [required]="true" [touched]="profileForm.get('nom')?.touched || false"
        [dirty]="profileForm.get('nom')?.dirty || false" [message]="nomMessage.message" [messageType]="nomMessage.type">
      </ui-input>
      <ui-input type="text" label="Prénom" [value]="profileForm.get('prenom')?.value || ''"
        (input)="updateFormControl(profileForm, 'prenom', $any($event.target).value)" placeholder="Prénom" id="prenom"
        [required]="true" [touched]="profileForm.get('prenom')?.touched || false"
        [dirty]="profileForm.get('prenom')?.dirty || false" [message]="prenomMessage.message"
        [messageType]="prenomMessage.type">
      </ui-input>
    </div>
    <ui-input type="file" accept="image/*" [multiple]="false" [maxSize]="5242880"
      placeholder="Glissez-déposez votre photo de profil ou cliquez pour sélectionner"
      [initialFiles]="getInitialFiles()"
      (filesSelected)="onAvatarSelected($event)" (fileError)="onAvatarError($event)" (fileRemoved)="onAvatarRemoved($event)">
    </ui-input>
  </div>
  <div class="form-actions">
    <ui-button color="primary500" [disabled]="isProfileLoading" (click)="onUpdateProfile()">
      @if (isProfileLoading) {
      Enregistrement...
      } @else {
      Enregistrer les modifications
      }
    </ui-button>
  </div>
</form>
<h2>Changer le mot de passe</h2>
<form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
  <div class="container-inputs">
    <ui-input type="password" label="Mot de passe actuel" [value]="passwordForm.get('currentPassword')?.value || ''"
      (input)="updateFormControl(passwordForm, 'currentPassword', $any($event.target).value)"
      placeholder="Entrez votre mot de passe actuel" id="currentPassword" [required]="true"
      [touched]="passwordForm.get('currentPassword')?.touched || false"
      [dirty]="passwordForm.get('currentPassword')?.dirty || false" [message]="currentPasswordMessage.message"
      [messageType]="currentPasswordMessage.type">
    </ui-input>
    <ui-input type="password" label="Nouveau mot de passe" [value]="passwordForm.get('newPassword')?.value || ''"
      (input)="updateFormControl(passwordForm, 'newPassword', $any($event.target).value)"
      placeholder="Minimum 12 caractères (maj, min, chiffre, spécial)" id="newPassword" [required]="true"
      [touched]="passwordForm.get('newPassword')?.touched || false"
      [dirty]="passwordForm.get('newPassword')?.dirty || false" [message]="newPasswordMessage.message"
      [messageType]="newPasswordMessage.type">
    </ui-input>
    <app-password-strength-indicator [password]="newPasswordValue"></app-password-strength-indicator>
    <ui-input type="password" label="Confirmer le nouveau mot de passe"
      [value]="passwordForm.get('confirmPassword')?.value || ''"
      (input)="updateFormControl(passwordForm, 'confirmPassword', $any($event.target).value)"
      placeholder="Confirmez votre nouveau mot de passe" id="confirmPassword" [required]="true"
      [touched]="passwordForm.get('confirmPassword')?.touched || false"
      [dirty]="passwordForm.get('confirmPassword')?.dirty || false" [message]="getConfirmPasswordMessage()"
      [messageType]="getConfirmPasswordMessageType()">
    </ui-input>
  </div>
  <div class="form-actions">
    <ui-button color="primary500" [disabled]="isPasswordLoading" (click)="onChangePassword()">
      @if (isPasswordLoading) {
      Modification...
      } @else {
      Modifier le mot de passe
      }
    </ui-button>
  </div>
</form>
}
