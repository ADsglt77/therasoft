@if (sent) {
  <app-feedback-card
    icon="check"
    variant="success"
    title="Email envoyé"
    message="Si un compte existe pour cette adresse, un lien de réinitialisation vient d'être envoyé. Pensez à vérifier vos spams.">
    <ui-button color="primary500" routerLink="/login">Retour à la connexion</ui-button>
  </app-feedback-card>
} @else {
  <app-feedback-card
    icon="eye"
    [iconSize]="28"
    variant="info"
    title="Mot de passe oublié"
    message="Entrez l'adresse email de votre compte : nous vous enverrons un lien pour réinitialiser votre mot de passe.">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <ui-input
        type="email"
        label="Email"
        id="forgot-email"
        placeholder="Votre email"
        [value]="form.get('email')?.value || ''"
        (input)="updateEmail($any($event.target).value)"
        [required]="true"
        [touched]="form.get('email')?.touched || false"
        [dirty]="form.get('email')?.dirty || false"
        [message]="emailMessage.message"
        [messageType]="emailMessage.type">
      </ui-input>

      <ui-button color="primary500" [block]="true" [disabled]="isLoading" (click)="onSubmit()">
        {{ isLoading ? 'Envoi…' : 'Envoyer le lien' }}
      </ui-button>
    </form>

    <a routerLink="/login" class="back">Retour à la connexion</a>
  </app-feedback-card>
}
