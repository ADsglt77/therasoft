@switch (state) {
  @case ('success') {
    <app-feedback-card
      icon="check"
      variant="success"
      title="Mot de passe réinitialisé"
      message="Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.">
      <ui-button color="primary500" routerLink="/login">Se connecter</ui-button>
    </app-feedback-card>
  }
  @case ('invalid') {
    <app-feedback-card
      icon="x"
      variant="error"
      title="Lien invalide ou expiré"
      message="Ce lien de réinitialisation n'est plus valide. Demandez-en un nouveau.">
      <ui-button color="primary500" routerLink="/mot-de-passe-oublie">Demander un nouveau lien</ui-button>
    </app-feedback-card>
  }
  @default {
    <app-feedback-card
      icon="settings"
      [iconSize]="28"
      variant="info"
      title="Nouveau mot de passe"
      message="Choisissez un nouveau mot de passe pour votre compte.">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <ui-input
          type="password"
          label="Nouveau mot de passe"
          id="reset-password"
          placeholder="Minimum 12 caractères (maj, min, chiffre, spécial)"
          [value]="form.get('newPassword')?.value || ''"
          (input)="update('newPassword', $any($event.target).value)"
          [required]="true"
          [touched]="form.get('newPassword')?.touched || false"
          [dirty]="form.get('newPassword')?.dirty || false"
          [message]="newPasswordMessage.message"
          [messageType]="newPasswordMessage.type">
        </ui-input>
        <app-password-strength-indicator [password]="newPasswordValue"></app-password-strength-indicator>

        <ui-input
          type="password"
          label="Confirmer le mot de passe"
          id="reset-confirm"
          placeholder="Confirmez le mot de passe"
          [value]="form.get('confirmPassword')?.value || ''"
          (input)="update('confirmPassword', $any($event.target).value)"
          [required]="true"
          [touched]="form.get('confirmPassword')?.touched || false"
          [dirty]="form.get('confirmPassword')?.dirty || false"
          [message]="confirmPasswordMessage.message"
          [messageType]="confirmPasswordMessage.type">
        </ui-input>

        <ui-button color="primary500" [block]="true" [disabled]="isLoading" (click)="onSubmit()">
          {{ isLoading ? 'Réinitialisation…' : 'Réinitialiser le mot de passe' }}
        </ui-button>
      </form>

      <a routerLink="/login" class="back">Retour à la connexion</a>
    </app-feedback-card>
  }
}
