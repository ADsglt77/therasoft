# Développement avec hot-reload (frontend + backend) derrière nginx.
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Accès : http://localhost (même URL qu'en prod, API en /api)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    entrypoint: ['sh', '/app/docker-entrypoint.dev.sh']
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/angular.json:/app/angular.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'

  nginx:
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
